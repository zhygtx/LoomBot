name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续提交时取消上一次构建，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建 · 格式校验
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 这里曾经跑全量测试：启 MySQL / Redis service、装 Python、跑集成测试，
    # 再由 JaCoCo 校验覆盖率门槛。测试与门槛已全部移除（见 docs/decisions.md D59），
    # 所以这些外部依赖一并去掉 —— 构建不再需要任何数据库或解释器。
    #
    # 剩下的约束只有两条，都由这一条 mvn verify 覆盖：
    #   validate 阶段 → spotless:check   代码格式不对，构建直接失败
    #   package  阶段 → 编译 + 打 fat jar
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 注意用 clean：不清理的话 target 里的旧产物会参与打包判断。
      - name: 格式校验 + 编译打包
        run: mvn -B clean verify
