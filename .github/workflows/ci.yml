name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续提交时取消上一次构建，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建 · 测试 · 架构校验 · 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 一次 verify 覆盖全部约束 —— 这就是「规则不挂 CI 就等于不存在」的落地：
      #   validate 阶段 → spotless:check      代码格式不对，构建直接失败
      #   test 阶段     → 单元测试 + ArchUnit 架构测试 + 生成 JaCoCo 报告
      #   verify 阶段   → JaCoCo 覆盖率门槛    低于阈值，构建直接失败
      #
      # 注意：本阶段刻意不启动 Spring 上下文，因此不需要 MySQL / Redis。
      # 后续引入 Testcontainers 做集成测试时，这里需要额外准备 Docker（GitHub 托管 runner 已自带）。
      - name: 执行完整校验
        run: mvn -B verify

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
