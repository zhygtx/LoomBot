name: Deploy

# 发布是 pull 模式：CI 只负责构建并把产物和发布指针传到 R2，
# 服务器上的 systemd timer 每分钟读一次指针，发现新 sha 才自行部署。
# 整条链路上没有任何外部机器登录服务器，所以 GitHub 里不需要保存 SSH 私钥。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    name: 构建后端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 格式校验 + 编译打包
        run: mvn -B clean verify

      - name: 打包后端产物
        run: |
          mkdir -p staging/python
          cp target/loombot.jar staging/
          cp -r python/system staging/python/system
          cp python/loombot_adapter.py python/loombot_node.py staging/python/
          tar -czf backend.tar.gz -C staging .

      - name: 上传后端产物
        uses: actions/upload-artifact@v7
        with:
          name: backend
          path: backend.tar.gz
          retention-days: 3

  frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # package.json 的 engines 要求 Node >= 24，必须对齐。
      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖并构建
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 打包前端产物
        working-directory: frontend
        run: tar -czf ../frontend.tar.gz -C dist .

      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 3

  publish:
    name: 发布到 R2
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 需要人工审批时在 GitHub 的 environment 里加保护规则；批准后才会写指针，服务器才部署。
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # 新版 AWS CLI 默认附带 CRC32 校验头，R2 不识别，必须降级为按需计算。
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 上传产物并更新发布指针
        run: |
          KEY="${{ github.sha }}"
          aws s3 cp artifacts/backend/backend.tar.gz "s3://$R2_BUCKET/releases/$KEY/backend.tar.gz" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp artifacts/frontend/frontend.tar.gz "s3://$R2_BUCKET/releases/$KEY/frontend.tar.gz" --endpoint-url "$R2_ENDPOINT"

          # 指针最后写：服务器读到指针时，两个产物一定已经就位。
          printf '{"sha":"%s","createdAt":"%s"}\n' "$KEY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/current.json
          aws s3 cp /tmp/current.json "s3://$R2_BUCKET/current.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json

          echo "已发布 $KEY，服务器会在一分钟内自行拉取部署"

      # pull 模式下 CI 不知道服务器何时部署完，所以按版本数清理，而不是部署后即删。
      - name: 清理旧发布包
        run: |
          KEY="${{ github.sha }}"
          aws s3 ls "s3://$R2_BUCKET/releases/" --recursive --endpoint-url "$R2_ENDPOINT" \
            | awk '{split($4,a,"/"); print $1"T"$2, a[2]}' \
            | sort -r \
            | awk '!seen[$2]++ {print $2}' \
            | tail -n +4 \
            | while read -r old; do
                [ -z "$old" ] && continue
                [ "$old" = "$KEY" ] && continue
                echo "清理旧发布包 $old"
                aws s3 rm "s3://$R2_BUCKET/releases/$old/" --recursive --endpoint-url "$R2_ENDPOINT"
              done
